name: Пост новин у Telegram

on:
  schedule:
    # Кожні 30 хв; скрипт сам вирішує, чи час постити.
    # Некруглі хвилини (:13/:43) — GitHub відкидає розклади на :00/:30 у пік навантаження.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ігнорувати розклад і запостити зараз"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

# УВАГА: concurrency навмисно НЕ на рівні workflow, а на рівні кожної job.
# Було 06.08.2026: група трималася на весь запуск, тож повільна job instagram
# (до 15 хв, ще й ставить ffmpeg через apt-get) блокувала слот, і 68% запусків
# скасовувалися чергою — канал мовчав по 36-79 хв замість 10-20. Тепер кожна
# job має власну групу й таймаут: постинг у канал не залежить від кросспостів.

jobs:
  post:
    runs-on: ubuntu-latest
    # Одночасно лише один постинг: інакше можливі дублі в каналі й конфлікт
    # push-у state.json між паралельними запусками.
    concurrency:
      group: news-post
      cancel-in-progress: false
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Запустити агента
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Необов'язковий: власна квота r.jina.ai замість спільного
          # анонімного пулу. Без нього читання Укрнету спирається на пул,
          # який плаваюче віддає 403 (див. newsbot/config.py READER_PROXIES).
          # Порожній секрет = поведінка як раніше, нічого не ламається.
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m newsbot.main --force
          else
            python -m newsbot.main
          fi

      - name: Зберегти стан (state.json)
        run: |
          if ! git diff --quiet state.json 2>/dev/null || [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: оновити стан постингу [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Зібрати статистику (реакції/підписники) і, раз на добу, надіслати зведення
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python -m newsbot.stats

      - name: Зберегти стан статистики (stats_state.json)
        continue-on-error: true
        run: |
          if ! git diff --quiet stats_state.json 2>/dev/null || [ -n "$(git status --porcelain stats_state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add stats_state.json
            git commit -m "chore: оновити стан статистики [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  # Незалежна задача: кросспост нових постів каналу у Threads.
  # Їде на надійному розкладі цього ж workflow (тригер кожні ~5 хв), але з
  # ВЛАСНОЮ concurrency-групою — щоб не тримати слот постингу в канал.
  crosspost:
    runs-on: ubuntu-latest
    continue-on-error: true
    concurrency:
      group: crosspost-threads
      cancel-in-progress: false
    timeout-minutes: 6
    steps:
      # Тригери приходять кожні ~5 хв (cron-job.org), але кросспосту така
      # частота не потрібна: корисної роботи тут 0.7 хв, а Threads нічого не
      # губить — черга ведеться за водяним знаком last_posted_id. Виміряно
      # 06.08.2026: job здебільшого не працювала, а ВИСІЛА в черзі по 4.7-5.1 хв
      # і гинула від наступного тригера (cancelled). Пропускаємо все, крім
      # вікна :00-:05 і :30-:35 — виходить ~раз на 30 хв.
      - name: Чи час кросспостити
        id: gate
        run: |
          MIN=$(date -u +%M)
          if [ "${{ github.event.inputs.force }}" = "true" ] || [ "$((10#$MIN % 30))" -lt 6 ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "Хвилина :$MIN поза вікном кросспосту — пропускаю."
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          ref: main
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'yes'
        with:
          python-version: "3.12"
      - if: steps.gate.outputs.run == 'yes'
        run: pip install requests beautifulsoup4
      - name: Відновити стан кросспосту
        if: steps.gate.outputs.run == 'yes'
        uses: actions/cache/restore@v4
        with:
          path: crosspost_state.json
          key: crosspost-state-${{ github.run_id }}
          restore-keys: |
            crosspost-state-
      - name: Кросспост у Threads
        if: steps.gate.outputs.run == 'yes'
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: Suputnyk_news
          MAX_PER_RUN: "3"
          SEED_LAST_ID: "207"
        run: python crosspost.py
      - name: Зберегти стан кросспосту
        # always() — щоб стан ліг у кеш навіть при збої самого кросспосту,
        # але тільки якщо крок узагалі виконувався (інакше на пропущених
        # запусках у кеш пішов би порожній файл і водяний знак скинувся б).
        if: always() && steps.gate.outputs.run == 'yes'
        uses: actions/cache/save@v4
        with:
          path: crosspost_state.json
          key: crosspost-state-${{ github.run_id }}

  # Незалежна задача: кросспост реальних відео-постів каналу в Instagram
  # Reels (лише пости з відео — Instagram не приймає текст/фото-пости).
  # Її збій НЕ впливає на публікацію в канал і на Threads (без needs,
  # continue-on-error, окремий кеш стану).
  instagram:
    runs-on: ubuntu-latest
    continue-on-error: true
    # Найповільніша job (ffmpeg + завантаження відео) — власна група й жорсткий
    # таймаут, щоб вона у жодному разі не впливала на постинг у канал.
    concurrency:
      group: crosspost-instagram
      cancel-in-progress: false
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 Pillow
      - name: Перевірити наявність ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Відновити стан Instagram-кросспосту
        uses: actions/cache/restore@v4
        with:
          path: instagram_crosspost_state.json
          key: instagram-crosspost-state-${{ github.run_id }}
          restore-keys: |
            instagram-crosspost-state-
      - name: Кросспост відео в Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: Suputnyk_news
          WATERMARK_LABEL: Suputnyk_news
          MAX_PER_RUN: "2"
        run: python instagram_crosspost.py
      - name: Зберегти стан Instagram-кросспосту
        if: always()
        uses: actions/cache/save@v4
        with:
          path: instagram_crosspost_state.json
          key: instagram-crosspost-state-${{ github.run_id }}
