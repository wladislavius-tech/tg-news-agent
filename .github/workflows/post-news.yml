name: Пост новин у Telegram

on:
  schedule:
    # Кожні 30 хв; скрипт сам вирішує, чи час постити.
    # Некруглі хвилини (:13/:43) — GitHub відкидає розклади на :00/:30 у пік навантаження.
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ігнорувати розклад і запостити зараз"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: news-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Запустити агента
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            python -m newsbot.main --force
          else
            python -m newsbot.main
          fi

      - name: Зберегти стан (state.json)
        run: |
          if ! git diff --quiet state.json 2>/dev/null || [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: оновити стан постингу [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - name: Зібрати статистику (реакції/підписники) і, раз на добу, надіслати зведення
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_ADMIN_CHAT: ${{ secrets.TELEGRAM_ADMIN_CHAT }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: python -m newsbot.stats

      - name: Зберегти стан статистики (stats_state.json)
        continue-on-error: true
        run: |
          if ! git diff --quiet stats_state.json 2>/dev/null || [ -n "$(git status --porcelain stats_state.json)" ]; then
            git config user.name "news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add stats_state.json
            git commit -m "chore: оновити стан статистики [skip ci]"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  # Незалежна задача: кросспост нових постів каналу у Threads.
  # Працює на надійному розкладі цього ж workflow (кожні 30 хв). Її збій
  # НЕ впливає на публікацію в канал (окрема job без needs, continue-on-error).
  crosspost:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Відновити стан кросспосту
        uses: actions/cache/restore@v4
        with:
          path: crosspost_state.json
          key: crosspost-state-${{ github.run_id }}
          restore-keys: |
            crosspost-state-
      - name: Кросспост у Threads
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: Suputnyk_news
          MAX_PER_RUN: "3"
          SEED_LAST_ID: "207"
        run: python crosspost.py
      - name: Зберегти стан кросспосту
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crosspost_state.json
          key: crosspost-state-${{ github.run_id }}

  # Незалежна задача: кросспост реальних відео-постів каналу в Instagram
  # Reels (лише пости з відео — Instagram не приймає текст/фото-пости).
  # Її збій НЕ впливає на публікацію в канал і на Threads (без needs,
  # continue-on-error, окремий кеш стану).
  instagram:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 Pillow
      - name: Перевірити наявність ffmpeg
        run: which ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Відновити стан Instagram-кросспосту
        uses: actions/cache/restore@v4
        with:
          path: instagram_crosspost_state.json
          key: instagram-crosspost-state-${{ github.run_id }}
          restore-keys: |
            instagram-crosspost-state-
      - name: Кросспост відео в Instagram
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: Suputnyk_news
          WATERMARK_LABEL: Suputnyk_news
          MAX_PER_RUN: "2"
        run: python instagram_crosspost.py
      - name: Зберегти стан Instagram-кросспосту
        if: always()
        uses: actions/cache/save@v4
        with:
          path: instagram_crosspost_state.json
          key: instagram-crosspost-state-${{ github.run_id }}
